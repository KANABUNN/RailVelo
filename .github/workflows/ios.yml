name: iOS App

on:
  push:
    branches: [main]
    paths: ['ios/**', 'swift/**', 'data/railway.sqlite', 'fixtures/corridor_full.jsonl', '.github/workflows/ios.yml', '.github/scripts/**']
  pull_request:
    paths: ['ios/**', 'swift/**', 'data/railway.sqlite', 'fixtures/corridor_full.jsonl', '.github/workflows/ios.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 26
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, subprocess
          candidates = []
          for app in pathlib.Path('/Applications').glob('Xcode*.app'):
              info = app / 'Contents/Info.plist'
              if not info.exists() or 'beta' in app.name.lower():
                  continue
              version = plistlib.loads(info.read_bytes()).get('CFBundleShortVersionString', '')
              if version.startswith('26.'):
                  candidates.append((tuple(int(x) for x in version.split('.')), app))
          if not candidates:
              raise SystemExit('Xcode 26 is required. Update the runner image before retrying.')
          app = max(candidates)[1]
          subprocess.run(['sudo', 'xcode-select', '-s', str(app / 'Contents/Developer')], check=True)
          PY
          xcodebuild -version
          xcodebuild -showsdks
      - name: Select iPhone 16 simulator
        id: simulator
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess
          # CoreSimulator service startup exceeded 60 seconds on a fresh hosted runner.
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], timeout=180))['devices']
          available = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json'], timeout=60))['runtimes']
          ios = [r for r in available if '.iOS-' in r['identifier'] and r.get('isAvailable')]
          if not ios:
              raise SystemExit('The runner does not include an available iOS simulator runtime.')
          runtime = max(ios, key=lambda r: tuple(int(x) for x in r['version'].split('.')))
          candidates = [d for d in devices.get(runtime['identifier'], []) if d['name'] == 'iPhone 16' and d.get('isAvailable')]
          if candidates:
              identifier = sorted(candidates, key=lambda d: d['udid'])[0]['udid']
          else:
              identifier = subprocess.check_output(['xcrun', 'simctl', 'create', 'RailVelo iPhone 16', 'com.apple.CoreSimulator.SimDeviceType.iPhone-16', runtime['identifier']], text=True, timeout=60).strip()
          selection = {'device': 'iPhone 16', 'id': identifier, 'runtime': runtime, 'host_architecture': platform.machine()}
          print(json.dumps(selection, indent=2), flush=True)
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/simulator-selection.json').write_text(json.dumps(selection, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('id=' + identifier + '\n')
          PY
      - name: Build Simulator application
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild -project ios/RailVelo.xcodeproj -scheme RailVelo \
            -configuration Debug -destination 'id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath .build/ios-simulator CODE_SIGNING_ALLOWED=NO build \
            | tee artifacts/ios-simulator-build.log
          python3 - <<'PY'
          import pathlib, plistlib
          app = pathlib.Path('.build/ios-simulator/Build/Products/Debug-iphonesimulator/RailVelo.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert 'UIApplicationSceneManifest' in info, 'SwiftUI application scene manifest is required.'
          assert info['UIApplicationSceneManifest']['UIApplicationSupportsMultipleScenes'] is False
          assert (app / 'railway.sqlite').is_file() and (app / 'corridor_full.jsonl').is_file()
          PY
      - name: Build iPhone application without signing
        run: |
          set -o pipefail
          xcodebuild -project ios/RailVelo.xcodeproj -scheme RailVelo \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ios-device CODE_SIGNING_ALLOWED=NO build \
            | tee artifacts/ios-device-build.log
      - name: Boot Simulator
        timeout-minutes: 8
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, platform, subprocess, time
          device = os.environ['SIMULATOR_ID']
          def run(args, timeout, check=True):
              started = time.monotonic()
              print(datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'), 'START', ' '.join(args), flush=True)
              try:
                  result = subprocess.run(args, check=check, timeout=timeout)
                  print('Exit code:', result.returncode, flush=True)
                  return result
              finally:
                  print(datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'), 'END', ' '.join(args), f'({time.monotonic() - started:.1f}s)', flush=True)
          try:
              result = run(['xcrun', 'simctl', 'boot', device], timeout=90, check=False)
              if result.returncode:
                  inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', '--json'], timeout=8))
                  booted = any(d['udid'] == device and d['state'] == 'Booted' for devices in inventory['devices'].values() for d in devices)
                  if not booted:
                      raise subprocess.CalledProcessError(result.returncode, result.args)
              run(['xcrun', 'simctl', 'bootstatus', device, '-b'], timeout=360)
          except (subprocess.SubprocessError, OSError):
              folder = pathlib.Path('artifacts')
              folder.mkdir(exist_ok=True)
              host = {'time_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'platform': platform.platform(), 'architecture': platform.machine(), 'mac_version': platform.mac_ver()[0]}
              (folder / 'simulator-host.json').write_text(json.dumps(host, indent=2))
              for name, args in [('devices', ['xcrun', 'simctl', 'list', 'devices', '--json']), ('runtimes', ['xcrun', 'simctl', 'list', 'runtimes', '--json']), ('runtime-images', ['xcrun', 'simctl', 'runtime', 'list', '-j'])]:
                  with (folder / f'simulator-{name}.txt').open('w') as output:
                      try:
                          subprocess.run(args, stdout=output, stderr=subprocess.STDOUT, timeout=8, check=False)
                      except (subprocess.SubprocessError, OSError) as error:
                          output.write(str(error) + '\n')
              raise
          PY
      - name: Install Simulator application
        timeout-minutes: 3
        run: |
          set -x
          DEVICE='${{ steps.simulator.outputs.id }}'
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" .build/ios-simulator/Build/Products/Debug-iphonesimulator/RailVelo.app
      - name: Launch replay and capture light and dark screenshots
        id: replay
        timeout-minutes: 4
        run: |
          set -x
          DEVICE='${{ steps.simulator.outputs.id }}'
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl launch "$DEVICE" jp.kb-dev.railvelo --replay-smoke
          export APP_DATA="$(xcrun simctl get_app_container "$DEVICE" jp.kb-dev.railvelo data)"
          python3 - <<'PY'
          import json, os, pathlib, sqlite3, time
          database = pathlib.Path(os.environ['APP_DATA']) / 'Library/Application Support/RailVelo/rides.sqlite'
          deadline = time.monotonic() + 45
          while True:
              try:
                  with sqlite3.connect(f'file:{database}?mode=ro', uri=True) as connection:
                      latest = connection.execute('SELECT id FROM sessions ORDER BY started_at DESC LIMIT 1').fetchone()
                      ready = latest is not None and connection.execute('SELECT COUNT(*) FROM samples WHERE session_id=? AND speed_kmh IS NOT NULL', latest).fetchone()[0] >= 5
              except sqlite3.Error:
                  ready = False
              if ready:
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit('Replay did not persist five valid speed samples within 45 seconds.')
              time.sleep(1)
          with sqlite3.connect(f'file:{database}?mode=ro', uri=True) as connection:
              session, mode, status = connection.execute('SELECT id,mode,status FROM sessions ORDER BY started_at DESC LIMIT 1').fetchone()
              assert mode == 'replay' and status == 'recording', (mode, status)
              rows = connection.execute('SELECT speed_kmh,match_json FROM samples WHERE session_id=?', (session,)).fetchall()
              valid = sum(speed is not None for speed, _ in rows)
              matched = sum(json.loads(match)['status'] == 'matched' for _, match in rows)
              assert len(rows) >= 5 and valid >= 5 and matched >= 1, (len(rows), valid, matched)
              summary = {'mode': mode, 'samples': len(rows), 'valid_speeds': valid, 'matched_positions': matched}
              pathlib.Path('artifacts/replay-smoke.json').write_text(json.dumps(summary, indent=2))
          PY
          xcrun simctl spawn "$DEVICE" launchctl list | grep jp.kb-dev.railvelo
          mkdir -p .build/ci
          xcrun swiftc .github/scripts/check-screenshot.swift -o .build/ci/check-screenshot
          xcrun simctl io "$DEVICE" screenshot artifacts/replay-light.png
          .build/ci/check-screenshot artifacts/replay-light.png light
          xcrun simctl ui "$DEVICE" appearance dark
          DARK_READY=0
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            xcrun simctl io "$DEVICE" screenshot artifacts/replay-dark.png
            if .build/ci/check-screenshot artifacts/replay-dark.png dark; then
              DARK_READY=1
              break
            fi
          done
          test "$DARK_READY" = 1
      - name: Recover interrupted replay
        timeout-minutes: 5
        run: |
          set -x
          DEVICE='${{ steps.simulator.outputs.id }}'
          export APP_DATA="$(xcrun simctl get_app_container "$DEVICE" jp.kb-dev.railvelo data)"
          python3 - <<'PY'
          import os, pathlib, sqlite3, subprocess, time
          device = os.environ.get('SIMULATOR_ID', '${{ steps.simulator.outputs.id }}')
          database = pathlib.Path(os.environ['APP_DATA']) / 'Library/Application Support/RailVelo/rides.sqlite'
          def command(*args, timeout=60):
              print('Recovery command:', ' '.join(args), flush=True)
              subprocess.run(args, check=True, timeout=timeout)
          with sqlite3.connect(f'file:{database}?mode=ro', uri=True) as connection:
              previous = {row[0] for row in connection.execute('SELECT id FROM sessions')}
          # Appearance capture may outlast the complete fixture. Start another genuine
          # replay, then interrupt it while its own SQLite session is still recording.
          command('xcrun', 'simctl', 'terminate', device, 'jp.kb-dev.railvelo', timeout=30)
          command('xcrun', 'simctl', 'launch', device, 'jp.kb-dev.railvelo', '--replay-smoke')
          deadline = time.monotonic() + 45
          while True:
              with sqlite3.connect(f'file:{database}?mode=ro', uri=True) as connection:
                  row = connection.execute('SELECT id,mode,status FROM sessions ORDER BY started_at DESC LIMIT 1').fetchone()
                  if row is not None and row[0] not in previous and row[1:] == ('replay', 'recording'):
                      if connection.execute('SELECT COUNT(*) FROM samples WHERE session_id=?', (row[0],)).fetchone()[0] >= 1:
                          session = row[0]
                          break
              if time.monotonic() >= deadline:
                  raise SystemExit('A new replay did not enter recording with a persisted sample.')
              time.sleep(1)
          command('xcrun', 'simctl', 'terminate', device, 'jp.kb-dev.railvelo', timeout=30)
          command('xcrun', 'simctl', 'launch', device, 'jp.kb-dev.railvelo')
          deadline = time.monotonic() + 30
          while True:
              with sqlite3.connect(f'file:{database}?mode=ro', uri=True) as connection:
                  status, started, ended = connection.execute('SELECT status,started_at,ended_at FROM sessions WHERE id=?', (session,)).fetchone()
              if status == 'interrupted' and ended is not None and ended >= started:
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit(f'Replay was not recovered as interrupted: {status}')
              time.sleep(1)
          pathlib.Path('artifacts/recovery-smoke.txt').write_text('Terminated replay recovered as interrupted with an end timestamp.\n')
          command('xcrun', 'simctl', 'terminate', device, 'jp.kb-dev.railvelo', timeout=30)
          PY
      - name: Test recording, graphs, history, CSV and large-text accessibility
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcrun simctl ui '${{ steps.simulator.outputs.id }}' appearance light
          xcodebuild -project ios/RailVelo.xcodeproj -scheme RailVelo \
            -configuration Debug -destination 'id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath .build/ios-simulator -resultBundlePath artifacts/ui-light.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 300 \
            -only-testing:RailVeloUITests/RailVeloUITests/testReplayRecordingGraphHistoryCSVAndDeletion \
            -only-testing:RailVeloUITests/RailVeloUITests/testLargeTextAccessibility \
            CODE_SIGNING_ALLOWED=NO test | tee artifacts/ui-light-tests.log
      - name: Test dark appearance and accessibility
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcrun simctl ui '${{ steps.simulator.outputs.id }}' appearance dark
          xcodebuild -project ios/RailVelo.xcodeproj -scheme RailVelo \
            -configuration Debug -destination 'id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath .build/ios-simulator -resultBundlePath artifacts/ui-dark.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 \
            -only-testing:RailVeloUITests/RailVeloUITests/testDarkReplayAccessibility \
            CODE_SIGNING_ALLOWED=NO test-without-building | tee artifacts/ui-dark-tests.log
      # User approved public diagnostics limited to synthetic replay on this disposable CI device.
      - name: Capture failed synthetic replay check
        if: failure() && steps.replay.outcome == 'failure'
        timeout-minutes: 2
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sqlite3, subprocess
          device = os.environ['SIMULATOR_ID']
          folder = pathlib.Path('artifacts')
          folder.mkdir(exist_ok=True)
          try:
              data = subprocess.check_output(['xcrun', 'simctl', 'get_app_container', device, 'jp.kb-dev.railvelo', 'data'], text=True, timeout=15).strip()
              database = pathlib.Path(data) / 'Library/Application Support/RailVelo/rides.sqlite'
              summary = {'database_exists': database.exists()}
              if database.exists():
                  with sqlite3.connect(f'file:{database}?mode=ro', uri=True) as connection:
                      sessions = connection.execute('SELECT mode,status FROM sessions').fetchall()
                      assert all(mode == 'replay' for mode, _ in sessions), 'Diagnostic capture requires replay-only sessions.'
                      summary['sessions'] = sessions
                      summary['samples'] = connection.execute('SELECT COUNT(*),COUNT(speed_kmh) FROM samples').fetchone()
                      summary['exclusions'] = connection.execute('SELECT exclusion_reason,COUNT(*) FROM samples GROUP BY exclusion_reason').fetchall()
              (folder / 'failed-replay-summary.json').write_text(json.dumps(summary, indent=2))
              subprocess.run(['xcrun', 'simctl', 'io', device, 'screenshot', str(folder / 'failed-replay.png')], timeout=25, check=False)
          except (subprocess.SubprocessError, OSError, sqlite3.Error) as error:
              (folder / 'failed-replay-diagnostic.txt').write_text(str(error) + '\n')
          PY
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 1
