name: Swift and iOS offline engine
on:
  push:
    paths: ['swift/**', 'python/**', 'tests/**', 'fixtures/**', 'data/**', 'scripts/**', '.github/workflows/swift.yml']
  pull_request:
    paths: ['swift/**', 'python/**', 'tests/**', 'fixtures/**', 'data/**', 'scripts/**', '.github/workflows/swift.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-and-parity:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python reference unit tests
        run: python -m unittest discover -s tests -v
      - name: Swift package unit tests
        env:
          RAILVELO_TEST_EXPORT_PATH: ${{ github.workspace }}/artifacts/analysis/artificial-swift-export.csv
        run: swift test --package-path swift
      - name: Read actual Swift-generated synthetic CSV with the ride evaluator
        run: |
          python scripts/analyze_ride.py artifacts/analysis/artificial-swift-export.csv --output artifacts/analysis/swift-consumer.json
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('artifacts/analysis/swift-consumer.json').read_text())
          assert report['evidence_kind'] == 'synthetic_replay'
          assert report['input']['mode'] == 'replay'
          assert report['recording']['observation_rows'] == 1
          assert report['recording']['wall_recording_duration_s'] == 10
          assert report['application_diagnostics']['rows'] == 1
          assert report['processing_performance']['received_to_persistence_start_s']['mean'] == 0.5
          assert report['device_measurements']['cpu_percent_one_core'] is None
          PY
      - name: iOS Simulator library build
        working-directory: swift
        run: |
          xcodebuild -scheme RailVeloLocation -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme RailVeloSQLite -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Compare Python and Swift replays for every shared fixture
        env:
          PYTHONPATH: python
        run: |
          swift build --package-path swift -c release
          mkdir -p artifacts/parity
          python - <<'PY'
          import json, pathlib, subprocess, sys
          manifest = json.loads(pathlib.Path('fixtures/manifest.json').read_text())
          for scenario in manifest['scenarios']:
              name = scenario['name']
              network = 'fixtures/' + scenario['network']
              observations = 'fixtures/' + scenario['observations']
              py_out = f'artifacts/parity/{name}.python.jsonl'
              sw_out = f'artifacts/parity/{name}.swift.jsonl'
              subprocess.run([sys.executable, 'scripts/replay.py', network, observations, '--output', py_out], check=True)
              subprocess.run(['swift/.build/release/railvelo-replay', '--network', network, '--input', observations, '--output', sw_out], check=True)
              subprocess.run([sys.executable, 'scripts/compare_replays.py', py_out, sw_out], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-python-parity-replays
          path: |
            artifacts/parity/
            artifacts/analysis/
          retention-days: 1
